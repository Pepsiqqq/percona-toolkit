apiVersion: ps.percona.com/v1
kind: PerconaServerMySQL
metadata:
  name: cluster-ps
  finalizers:
    - percona.com/delete-mysql-pods-in-order
spec:
  crVersion: 0.12.0
  secretsName: ps-cluster1-secrets
  sslSecretName: ps-cluster1-ssl
  updateStrategy: SmartUpdate
  upgradeOptions:
    versionServiceEndpoint: https://check.percona.com
    apply: disabled
  mysql:
    clusterType: group-replication
    autoRecovery: true
    image: percona/percona-server:8.4.6-6.1
    imagePullPolicy: Always
    size: 3
    podDisruptionBudget:
      maxUnavailable: 1
    resources:
      requests:
        memory: 2Gi
      limits:
        memory: 4Gi
    affinity:
      antiAffinityTopologyKey: "none"
    exposePrimary:
      enabled: true
    volumeSpec:
      persistentVolumeClaim:
        resources:
          requests:
            storage: 2Gi
    gracePeriod: 600
  proxy:
    haproxy:
      enabled: true
      size: 3
      image: percona/haproxy:2.8.15
      imagePullPolicy: Always
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        requests:
          memory: 1Gi
          cpu: 600m
      gracePeriod: 30
      affinity:
        antiAffinityTopologyKey: "none"
    router:
      enabled: false
      image: percona/percona-mysql-router:8.4.6
      imagePullPolicy: Always
      size: 3
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        requests:
          memory: 256M
        limits:
          memory: 256M
      affinity:
        antiAffinityTopologyKey: "none"
      gracePeriod: 30
  orchestrator:
    enabled: false
    image: percona/percona-orchestrator:3.2.6-18
    imagePullPolicy: Always
    size: 3
    affinity:
      antiAffinityTopologyKey: "none"
    podDisruptionBudget:
      maxUnavailable: 1
    gracePeriod: 30
    resources:
      requests:
        memory: 128M
      limits:
        memory: 256M
  pmm:
    enabled: false
    image: percona/pmm-client:3.4.0
    imagePullPolicy: Always
    resources:
      requests:
        memory: 150M
        cpu: 300m
    serverHost: monitoring-service
  backup:
    enabled: true
    image: percona/percona-xtrabackup:8.4.0-4.1
    imagePullPolicy: Always
    storages:
      s3-us-west:
        type: s3
        verifyTLS: true
        s3:
          bucket: S3-BACKUP-BUCKET-NAME-HERE
          credentialsSecret: ps-cluster1-s3-credentials
          region: us-west-2
  toolkit:
    image: percona/percona-toolkit:3.7.0-2
    imagePullPolicy: Always
